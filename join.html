<style>
  /* Global readability pass (P13F) — same intent as the ecos.html app:
     keep decorative chrome (.join-eyebrow, .join-step, .trust-strip) as-is,
     but make real content (form fields, choices, buttons) easier to read. */
  .card-title {
    font-family: inherit; font-size: 14.5px; font-weight: 700;
    letter-spacing: normal; text-transform: none; color: var(--text-1);
  }
  .field label {
    font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: normal; text-transform: none; color: var(--text-1);
  }
  .input, .select, .textarea { font-size: 16px; padding: 12px 14px; color: var(--text-1); }
  .textarea { min-height: 110px; }
  .btn { font-size: 15px; padding: 9px 14px; }
  .help { font-size: 12.5px; color: var(--text-3); }
  .choice .sub { font-size: 13px; color: var(--text-3); }
  .welcome-option .meta { font-size: 14px; }
</style>
