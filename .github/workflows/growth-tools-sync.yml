# ecos — Growth Tools scheduled sync (G3C/G3D).
#
# Runs scripts/sync-growth-tools.js --provider=all (Israel Innovation
# Authority, Rakia, Growth Administration, MAFAT/DDR&D) on a schedule and on
# manual dispatch, then commits ONLY the two generated artifacts
# (src/data/generated/growth-tools-source-data.js and
# growth-tools-sync-log.json) — and only when a real, valid source-owned
# field actually changed, for ANY of the four providers. No Admin approval
# step: this is the deliberate automatic-apply product decision made for
# G3B/G3C/G3D. One provider's fetch failing (or being fully blocked) never
# aborts the others — the runner processes all four sequentially and always
# exits 0 unless something genuinely unexpected happens (see below).
#
# This workflow does not build or deploy anything itself. It only pushes a
# data commit to the default branch; whatever GitHub Pages deployment
# mechanism is already configured for this repository (this repo currently
# has no other Actions workflow, so Pages most likely deploys via classic
# branch-based publishing from `main`) reacts to that push exactly like any
# other commit — unchanged, undisrupted.
#
# G3C decision (still in force for every provider added since): a fully-
# blocked provider (e.g. HTTP 403) completes this workflow WITH A WARNING,
# not a failure. A blocked external site is an expected, already-documented
# condition — it is not a bug in this pipeline, and treating it as a red/
# failed run would create daily false-alarm noise indistinguishable from an
# actual CI break. scripts/sync-growth-tools.js prints one `::warning::`
# GitHub Actions annotation per affected provider whenever any/all of its
# sources fail, so the condition is always clearly visible in the run's own
# log, naming the specific provider, without failing the job. Any OTHER
# unexpected error (e.g. the script throwing) still fails the job normally
# via its non-zero exit code.
#
# G3D update: locally, Innovation Authority unexpectedly returned HTTP 200
# (not 403) once this batch's shared fetch helper started sending an
# explicit, honest, self-identifying User-Agent header
# ("EcosystemOS-GrowthToolsSync/1.0") instead of no header at all — while a
# bare `curl` from the same environment still gets 403. This is not a
# deliberate bypass (no UA spoofing, no proxy, no browser impersonation,
# no CAPTCHA/WAF evasion of any kind) — it's simply Node's own HTTP client
# behaving differently than curl against whatever heuristic the site's WAF
# uses. Rakia and Growth Administration were reachable from the start. Local
# reachability is NOT the same fact as GitHub-runner reachability (separate
# network path/IP range) — this workflow's first real run is what tells us
# whether GitHub-hosted runners see the same result for all four providers.

name: Growth Tools Sync

on:
  schedule:
    # Once daily, off-peak UTC minute (avoids the top-of-hour congestion
    # most scheduled Actions pile onto). Not more frequent than needed.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

# Only the two generated Growth Tools files are ever written/committed by
# this workflow — no broader repo write access is requested.
permissions:
  contents: write

# Prevents two sync runs (a schedule tick overlapping a manual dispatch, or
# two manual dispatches) from writing the generated artifacts concurrently.
# Queues rather than cancels, so an in-flight run is never killed mid-write.
concurrency:
  group: growth-tools-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Deterministic, network-free — must pass before any live provider
      # call is attempted. No test framework: these are the project's own
      # plain-Node fixture scripts (see scripts/test-growth-tools-sync*.js).
      - name: Run deterministic sync tests
        run: |
          node scripts/test-growth-tools-sync.js
          node scripts/test-growth-tools-sync-g3b.js
          node scripts/test-growth-tools-sync-g3d.js

      # The only network calls in this whole workflow — one real fetch per
      # canonical Growth Tool, gated inside each provider's own adapter
      # (src/services/growth-tools-adapters.js). Exits 0 even when every
      # source for a given provider is blocked (see the file header above)
      # — only an unexpected script error fails this step. Providers run
      # sequentially inside the script itself, so one being blocked never
      # prevents the others from syncing.
      - name: Sync all providers
        run: node scripts/sync-growth-tools.js --provider=all

      # Detects a real change without relying on timestamps: the generated
      # source-data file only differs from HEAD when a source-owned field
      # actually changed (G3B's byte-identical no-op guarantee) — a run
      # that only updates internal bookkeeping without a real field change
      # never touches the file at all, so this diff is exact, not a proxy.
      - name: Check for real data changes
        id: diff
        run: |
          if git diff --quiet -- src/data/generated/growth-tools-source-data.js src/data/generated/growth-tools-sync-log.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Growth Tools data changed this run — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Growth Tools data changed — committing."
          fi

      # Stages ONLY the two generated files, never anything else in the
      # working tree (there should be nothing else changed by the steps
      # above, but this is explicit rather than relying on that).
      - name: Commit and push generated data changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/growth-tools-source-data.js src/data/generated/growth-tools-sync-log.json
          git commit -m "data(growth-tools): sync official sources"
          git push
